<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Setliste - EoN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .image-container {
      width: 100%;
      padding: 10px;
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .back-button {
      display: block;
      width: calc(100% - 30px);
      margin: 15px auto 25px;
      padding: 15px 10px;

      background: #fff;
      color: #000;

      text-decoration: none;
      text-align: center;

      font-size: 20px;
      font-weight: bold;

      border-radius: 8px;
    }

    .back-button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="image-container">
    <img src="setliste.jpg" alt="Setliste EoN">
  </div>

  <a class="back-button" href="index.html">
    ← Retour à l'accueil
  </a>

</body>
</html>
